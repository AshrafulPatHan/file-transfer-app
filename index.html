<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <!-- css -->
     <style>

        /* Select font */
        @font-face {
            font-family: 'play';
            /* Make sure this path is relative to your CSS file! */
            src: url('assets/PlaywriteNZBasic-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900; /* Allows the full range of weights */
            font-style: normal;
        }

        /* global css */
        *{
            margin: 0px;
            padding: 0px;
        }

        /* head text */
        h1{
            font-family: 'play', sans-serif;
            margin-top: 30px;
            color: white;
        }

        /* main section */
        .main{
            background-color: #128caa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* form submit */
        ._form{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* file input */
        /* From Uiverse.io by 3bdel3ziz-T */ 
        .container {
            --transition: 350ms;
            --folder-W: 120px;
            --folder-H: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 10px;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            height: calc(var(--folder-H) * 1.7);
            position: relative;
        }

        .folder {
            position: absolute;
            top: -20px;
            left: calc(50% - 60px);
            animation: float 2.5s infinite ease-in-out;
            transition: transform var(--transition) ease;
        }

        .folder:hover {
            transform: scale(1.05);
        }

        .folder .front-side,
        .folder .back-side {
            position: absolute;
            transition: transform var(--transition);
            transform-origin: bottom center;
        }

        .folder .back-side::before,
        .folder .back-side::after {
            content: "";
            display: block;
            background-color: white;
            opacity: 0.5;
            z-index: 0;
            width: var(--folder-W);
            height: var(--folder-H);
            position: absolute;
            transform-origin: bottom center;
            border-radius: 15px;
            transition: transform 350ms;
            z-index: 0;
        }

        .container:hover .back-side::before {
            transform: rotateX(-5deg) skewX(5deg);
        }
        .container:hover .back-side::after {
            transform: rotateX(-15deg) skewX(12deg);
        }

        .folder .front-side {
            z-index: 1;
        }

        .container:hover .front-side {
            transform: rotateX(-40deg) skewX(15deg);
        }

        .folder .tip {
            background: linear-gradient(135deg, #ff9a56, #ff6f56);
            width: 80px;
            height: 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: absolute;
            top: -10px;
            z-index: 2;
        }

        .folder .cover {
            background: linear-gradient(135deg, #ffe563, #ffc663);
            width: var(--folder-W);
            height: var(--folder-H);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .custom-file-upload {
            font-size: 1.1em;
            color: #ffffff;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: background var(--transition) ease;
            display: inline-block;
            width: 60%;
            padding: 10px 35px;
            position: relative;
        }

        .custom-file-upload:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .custom-file-upload input[type="file"] {
            display: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }


        /* button */
        .Documents-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: fit-content;
            height: 45px;
            border: none;
            padding: 0px 15px;
            border-radius: 5px;
            background-image: linear-gradient(135deg, #6dd5ed, #2193b0);;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            }
            .folderContainer {
            width: 40px;
            height: fit-content;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }
        .fileBack {
            z-index: 1;
            width: 80%;
            height: auto;
        }
        .filePage {
            width: 50%;
            height: auto;
            position: absolute;
            z-index: 2;
            transition: all 0.3s ease-out;
        }
        .fileFront {
            width: 85%;
            height: auto;
            position: absolute;
            z-index: 3;
            opacity: 0.95;
            transform-origin: bottom;
            transition: all 0.3s ease-out;
        }
        .text {
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .Documents-btn:hover .filePage {
            transform: translateY(-5px);
        }
        .Documents-btn:hover {
            background-color: rgb(58, 58, 94);
        }
        .Documents-btn:active {
            transform: scale(0.95);
        }
        .Documents-btn:hover .fileFront {
            transform: rotateX(30deg);
        }

        
     </style>
</head>

<body>
    <div class="main">
        <h1>Upload a File</h1>
        <form action="/upload" method="post" enctype="multipart/form-data" class="_form">
            <div class="container">
                <div class="folder">
                    <div class="front-side">
                        <div class="tip"></div>
                        <div class="cover"></div>
                    </div>
                    <div class="back-side cover"></div>
                </div>
                <label class="custom-file-upload">
                    <input name="file" class="title" type="file" required />
                    Choose a file
                </label>
            </div>

            <button  type="submit" class="Documents-btn">
                <span class="folderContainer">
                    <svg
                    class="fileBack"
                    width="146"
                    height="113"
                    viewBox="0 0 146 113"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <path
                        d="M0 4C0 1.79086 1.79086 0 4 0H50.3802C51.8285 0 53.2056 0.627965 54.1553 1.72142L64.3303 13.4371C65.2799 14.5306 66.657 15.1585 68.1053 15.1585H141.509C143.718 15.1585 145.509 16.9494 145.509 19.1585V109C145.509 111.209 143.718 113 141.509 113H3.99999C1.79085 113 0 111.209 0 109V4Z"
                        fill="url(#paint0_linear_117_4)"
                    ></path>
                    <defs>
                        <linearGradient
                        id="paint0_linear_117_4"
                        x1="0"
                        y1="0"
                        x2="72.93"
                        y2="95.4804"
                        gradientUnits="userSpaceOnUse"
                        >
                        <stop stop-color="#8F88C2"></stop>
                        <stop offset="1" stop-color="#5C52A2"></stop>
                        </linearGradient>
                    </defs>
                    </svg>
                    <svg
                    class="filePage"
                    width="88"
                    height="99"
                    viewBox="0 0 88 99"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <rect width="88" height="99" fill="url(#paint0_linear_117_6)"></rect>
                    <defs>
                        <linearGradient
                        id="paint0_linear_117_6"
                        x1="0"
                        y1="0"
                        x2="81"
                        y2="160.5"
                        gradientUnits="userSpaceOnUse"
                        >
                        <stop stop-color="white"></stop>
                        <stop offset="1" stop-color="#686868"></stop>
                        </linearGradient>
                    </defs>
                    </svg>

                    <svg
                    class="fileFront"
                    width="160"
                    height="79"
                    viewBox="0 0 160 79"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <path
                        d="M0.29306 12.2478C0.133905 9.38186 2.41499 6.97059 5.28537 6.97059H30.419H58.1902C59.5751 6.97059 60.9288 6.55982 62.0802 5.79025L68.977 1.18034C70.1283 0.410771 71.482 0 72.8669 0H77H155.462C157.87 0 159.733 2.1129 159.43 4.50232L150.443 75.5023C150.19 77.5013 148.489 79 146.474 79H7.78403C5.66106 79 3.9079 77.3415 3.79019 75.2218L0.29306 12.2478Z"
                        fill="url(#paint0_linear_117_5)"
                    ></path>
                    <defs>
                        <linearGradient
                        id="paint0_linear_117_5"
                        x1="38.7619"
                        y1="8.71323"
                        x2="66.9106"
                        y2="82.8317"
                        gradientUnits="userSpaceOnUse"
                        >
                        <stop stop-color="#C3BBFF"></stop>
                        <stop offset="1" stop-color="#51469A"></stop>
                        </linearGradient>
                    </defs>
                    </svg>
                </span>
                <p class="text">Upload File</p>
                </button>
        </form>
    </div>
    
</body>

</html>
